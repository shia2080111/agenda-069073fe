<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baisu Meetings">
<meta name="robots" content="noindex">
<title>Baisu Meeting Arrangement</title>
<style>
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", sans-serif; background: #f2f3f5; color: #1f2329; }
  header { position: sticky; top: 0; background: #fff; padding: calc(env(safe-area-inset-top) + 10px) 16px 0; box-shadow: 0 1px 0 #e5e6eb; z-index: 1; }
  h1 { font-size: 18px; margin: 4px 0 10px; }
  .titlebar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .refresh { flex: none; border: 1px solid #c9cdd4; background: #fff; color: #1456f0; border-radius: 16px; padding: 4px 12px; font-size: 14px; margin-bottom: 6px; }
  .tabs { display: flex; gap: 8px; }
  .tab { flex: 1; padding: 10px 0; border: 0; background: none; font-size: 15px; color: #646a73; border-bottom: 3px solid transparent; }
  .tab.on { color: #1456f0; border-bottom-color: #1456f0; font-weight: 600; }
  main { padding: 12px 12px 40px; }
  .count { color: #646a73; font-size: 13px; margin: 2px 4px 10px; }
  .card { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .card { position: relative; }
  .time { font-size: 15px; font-weight: 600; color: #1456f0; padding-right: 84px; }
  .copy { position: absolute; top: 10px; right: 12px; padding: 6px 10px; border: 1px solid #c9cdd4; border-radius: 6px; background: #fff; color: #4e5969; font-size: 13px; }
  .copy.done { border-color: #00b42a; color: #00b42a; }
  .name { font-size: 16px; font-weight: 600; margin: 6px 0 8px; line-height: 1.4; padding-right: 20px; }
  .row { font-size: 14px; color: #4e5969; margin: 4px 0; line-height: 1.4; }
  .join { display: block; margin-top: 12px; padding: 12px; border-radius: 8px; background: #1456f0; color: #fff; text-align: center; text-decoration: none; font-size: 16px; font-weight: 600; }
  .join.meet { background: #188038; }
  .empty { text-align: center; color: #86909c; padding: 40px 0; }
  .foot { text-align: center; color: #c9cdd4; font-size: 12px; }
  #lock { display: flex; flex-direction: column; align-items: center; padding: 30vh 24px 0; gap: 12px; }
  #lock input { width: 200px; padding: 12px; font-size: 20px; text-align: center; border: 1px solid #c9cdd4; border-radius: 8px; letter-spacing: 4px; }
  #lock button { width: 200px; padding: 12px; font-size: 16px; border: 0; border-radius: 8px; background: #1456f0; color: #fff; }
  #err { color: #f53f3f; font-size: 14px; min-height: 20px; }
  .cal { background: #fff; border-radius: 12px; padding: 10px 8px 6px; margin-bottom: 12px; }
  .calhead { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 8px; font-size: 16px; font-weight: 600; }
  .nav { border: 0; background: none; font-size: 26px; color: #1456f0; padding: 0 12px; line-height: 1; }
  .nav:disabled { color: #e5e6eb; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .wd { font-size: 12px; color: #86909c; padding: 4px 0; }
  .day { border: 0; background: none; border-radius: 8px; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; color: #1f2329; }
  .day span { font-size: 16px; line-height: 22px; width: 30px; border-radius: 50%; }
  .day i { font-style: normal; font-size: 10px; color: #1456f0; height: 14px; }
  .day.today span { color: #1456f0; font-weight: 700; box-shadow: inset 0 0 0 1.5px #1456f0; }
  .day.sel { background: #1456f0; }
  .day.sel span, .day.sel i { color: #fff; box-shadow: none; }
  .selday { font-size: 15px; font-weight: 600; margin: 4px 4px 8px; }
</style>
</head>
<body>
<div id="lock">
  <div>请输入访问密码</div>
  <input id="pw" type="password" inputmode="numeric" autocomplete="off">
  <button onclick="unlock(document.getElementById('pw').value, true)">查看日程</button>
  <div id="err"></div>
</div>
<div id="app" hidden>

  <main id="list"></main>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA;

async function unlock(pw, manual) {
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(BLOB.salt), iterations: BLOB.iter, hash: 'SHA-256'},
                                              base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(BLOB.iv)}, key, b64(BLOB.ct));
    DATA = JSON.parse(new TextDecoder().decode(pt));
    localStorage.setItem('agenda_pw', pw);
    document.getElementById('lock').hidden = true;
    document.getElementById('app').hidden = false;
    monthIdx = Math.max(0, DATA.months.indexOf(TODAY.slice(0, 7)));
    render();
  } catch (e) {
    if (manual) document.getElementById('err').textContent = '密码不正确';
    else localStorage.removeItem('agenda_pw');
  }
}

const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayTitle = k => { const d = new Date(k + 'T00:00'); return `${d.getMonth() + 1}月${d.getDate()}日 ${WD[d.getDay()]}`; };
const TODAY = iso(new Date());
let tab = 'today', sel = TODAY, monthIdx = 0, curEvents = [], curKey = TODAY;

function render() {
  document.getElementById('tabs').innerHTML =
    `<button class="tab${tab === 'today' ? ' on' : ''}" onclick="tab='today';render()">今天 · ${dayTitle(TODAY)}</button>` +
    `<button class="tab${tab === 'cal' ? ' on' : ''}" onclick="tab='cal';render()">📅 日历</button>`;
  const html = tab === 'today' ? dayHtml(TODAY) : calHtml() + `<div class="selday">${dayTitle(sel)}${sel === TODAY ? '（今天）' : ''}</div>` + dayHtml(sel);
  document.getElementById('list').innerHTML = html + `<div class="foot">更新于 ${esc(DATA.updated)}</div>`;
}

function calHtml() {
  const [y, m] = DATA.months[monthIdx].split('-').map(Number);
  const first = new Date(y, m - 1, 1), ndays = new Date(y, m, 0).getDate();
  const lead = (first.getDay() + 6) % 7;  // 周一开头
  let h = `<div class="cal"><div class="calhead">
    <button class="nav" ${monthIdx === 0 ? 'disabled' : ''} onclick="monthIdx--;render()">‹</button>
    <span>${y}年${m}月</span>
    <button class="nav" ${monthIdx === DATA.months.length - 1 ? 'disabled' : ''} onclick="monthIdx++;render()">›</button></div>
    <div class="grid">${['一', '二', '三', '四', '五', '六', '日'].map(w => `<div class="wd">${w}</div>`).join('')}`;
  for (let i = 0; i < lead; i++) h += '<div></div>';
  for (let d = 1; d <= ndays; d++) {
    const k = `${y}-${pad(m)}-${pad(d)}`, n = (DATA.days[k] || []).length;
    const cls = ['day', k === TODAY ? 'today' : '', k === sel ? 'sel' : ''].join(' ');
    h += `<button class="${cls}" onclick="sel='${k}';render()"><span>${d}</span><i>${n ? n + '项' : ''}</i></button>`;
  }
  return h + '</div></div>';
}

function dayHtml(k) {
  const evs = DATA.days[k] || [];
  curEvents = evs; curKey = k;
  const inRange = DATA.months.includes(k.slice(0, 7));
  let html = !inRange ? '<div class="empty">该日期暂无数据</div>'
           : evs.length ? `<div class="count">共 ${evs.length} 项安排</div>` : '<div class="empty">✅ 没有会议，自由安排~</div>';
  evs.forEach((e, i) => {
    html += `<div class="card"><button class="copy" onclick="copyEv(this, ${i})">一键复制</button><div class="time">⏰ ${esc(e.time)}</div><div class="name">${esc(e.summary)}</div>`;
    if (e.location) html += `<div class="row">📍 ${esc(e.location)}</div>`;
    if (e.platform) html += `<div class="row">💻 ${esc(e.platform)}</div>`;
    if (e.mid) html += `<div class="row">🔢 会议号：${esc(e.mid)}</div>`;
    if (e.pwd) html += `<div class="row">🔑 ${esc(e.pwdLabel)}：${esc(e.pwd)}</div>`;
    if (e.url) html += `<a class="join${e.platform === 'Google Meet' ? ' meet' : ''}" href="${esc(e.url)}">进入会议</a>`;
    html += '</div>';
  });
  return html;
}

function copyEv(btn, i) {
  const e = curEvents[i];
  const lines = [`会议名称：${e.summary}`, `会议时间：${dayTitle(curKey)} ${e.time}`];
  if (e.mid) lines.push(`会议号：${e.mid}`);
  if (e.pwd) lines.push(`会议${e.pwdLabel}：${e.pwd}`);
  const text = lines.join('\n');
  const ok = () => { btn.textContent = '已复制 ✓'; btn.classList.add('done');
                     setTimeout(() => { btn.textContent = '一键复制'; btn.classList.remove('done'); }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok, () => fallbackCopy(text, ok));
  } else fallbackCopy(text, ok);
}
function fallbackCopy(text, ok) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  document.execCommand('copy'); document.body.removeChild(ta); ok();
}

document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(e.target.value, true); });
const saved = localStorage.getItem('agenda_pw');
if (saved) unlock(saved, false);
</script>
